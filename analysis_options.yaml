include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # This project does a lot of numeric and geometric work where an implicit
    # dynamic or an unchecked cast would hide a units or frame-of-reference
    # error until it reached a road.
    strict-casts: true
    strict-raw-types: true
  errors:
    # A missing await in the pipeline or the recorder is a real defect, not a
    # style preference.
    unawaited_futures: error
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    # avoid_slow_async_io is deliberately NOT enabled: it prefers the
    # synchronous dart:io calls, but every use here is on an async path
    # (listing recordings, scanning a drive) where blocking the isolate
    # would stall the UI or the pipeline.
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    - implicit_call_tearoffs
    - no_duplicate_case_values
    - prefer_final_locals
    - prefer_typing_uninitialized_variables
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - valid_regexps
