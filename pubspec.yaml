name: aicar
description: >-
  Mobile Autonomous Driving Simulator - an on-device ADAS research and
  simulation platform. SIMULATION ONLY: never connects to a vehicle.
publish_to: 'none'
version: 0.14.0+14

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # --- Sensors / hardware -------------------------------------------------
  camera: ^0.11.0+2
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  battery_plus: ^6.2.1
  wakelock_plus: ^1.2.10

  # --- Storage ------------------------------------------------------------
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3

  # --- State / utils ------------------------------------------------------
  provider: ^6.1.2
  collection: ^1.19.0
  vector_math: ^2.1.4
  intl: ^0.20.1
  ffi: ^2.1.3
  meta: ^1.16.0
  crypto: ^3.0.6

  # --- Navigation (online module, optional at runtime) --------------------
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- Media --------------------------------------------------------------
  image: ^4.3.0
  # Driver-facing alerts. Tones for urgency, speech for information — see
  # lib/audio/driving_alerts.dart for why both are needed.
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/labels/
